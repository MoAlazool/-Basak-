<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الإيصال</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:#00658D;text-decoration:none}a:hover{color:#004F6E}
</style>
</helmet>
<div dir="rtl" style="width:390px;height:844px;background:#F0F5F8;font-family:'Readex Pro','Segoe UI',Tahoma,sans-serif;color:#17384A;display:flex;flex-direction:column;padding:60px 20px 0;overflow:hidden">

<div style="display:flex;align-items:center;gap:12px;padding-bottom:20px">
<a href="Subscription.dc.html" aria-label="رجوع" style="width:44px;height:44px;border-radius:22px;background:#FFFFFF;color:#17384A;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(23,56,74,.05);flex:none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"></path></svg>
</a>
<h1 style="margin:0;font-size:20px;line-height:30px;font-weight:600">الإيصال</h1>
</div>

<div style="display:flex;flex-direction:column;gap:16px">

<section style="background:#FFFFFF;border-radius:28px;padding:22px 20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(23,56,74,.05)">
<div style="display:flex;align-items:center;justify-content:space-between">
<div style="display:flex;align-items:center;gap:6px;background:#E3F4EC;color:#0A6B4A;border-radius:999px;padding:5px 12px 5px 10px;font-size:13px;line-height:20px;font-weight:500">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
<span>مدفوع ومعتمد</span>
</div>
<div dir="ltr" style="font-size:13px;line-height:20px;color:#58707F">26-7F3A9C2E</div>
</div>
<div style="font-size:34px;line-height:44px;font-weight:600">4,500 <span style="font-size:16px;font-weight:400;color:#58707F">ج.م</span></div>
<div style="font-size:14px;line-height:22px;color:#476273">22 سبتمبر 2026 · InstaPay</div>
</section>

<div style="background:#FFFFFF;border-radius:20px;padding:0 18px;box-shadow:0 1px 2px rgba(23,56,74,.05)">

<button type="button" aria-expanded="{{subExp}}" onClick="{{toggleSub}}" style="width:100%;display:flex;align-items:center;justify-content:space-between;min-height:56px;font-size:16px;line-height:24px;font-weight:600">
<span>الاشتراك</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#58707F" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform:rotate({{subRot}})"><path d="m6 9 6 6 6-6"></path></svg>
</button>
<sc-if value="{{subOpen}}" hint-placeholder-val="{{true}}">
<div style="display:flex;flex-direction:column;gap:12px;padding-bottom:16px">
<div style="display:flex;justify-content:space-between;gap:12px;font-size:14px;line-height:22px"><span style="color:#476273">الفترة</span><span style="font-weight:500">الفصل الأول 2026/2027</span></div>
<div style="display:flex;justify-content:space-between;gap:12px;font-size:14px;line-height:22px"><span style="color:#476273">الصلاحية</span><span style="font-weight:500">20 سبتمبر – 14 يناير 2027</span></div>
<div style="display:flex;justify-content:space-between;gap:12px;font-size:14px;line-height:22px"><span style="color:#476273">الخط</span><span style="font-weight:500">الزرقا</span></div>
<div style="display:flex;justify-content:space-between;gap:12px;font-size:14px;line-height:22px"><span style="color:#476273">محطة الصعود</span><span style="font-weight:500">كوبري السرو</span></div>
</div>
</sc-if>

<button type="button" aria-expanded="{{stuExp}}" onClick="{{toggleStu}}" style="width:100%;display:flex;align-items:center;justify-content:space-between;min-height:56px;border-top:1px solid #DCE6EC;font-size:16px;line-height:24px;font-weight:600">
<span>الطالب</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#58707F" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform:rotate({{stuRot}})"><path d="m6 9 6 6 6-6"></path></svg>
</button>
<sc-if value="{{stuOpen}}" hint-placeholder-val="{{false}}">
<div style="display:flex;flex-direction:column;gap:12px;padding-bottom:16px">
<div style="display:flex;justify-content:space-between;gap:12px;font-size:14px;line-height:22px"><span style="color:#476273">الاسم</span><span style="font-weight:500">سارة أحمد محمود</span></div>
<div style="display:flex;justify-content:space-between;gap:12px;font-size:14px;line-height:22px"><span style="color:#476273">الهاتف</span><span dir="ltr" style="font-weight:500">010 2345 6789</span></div>
<div style="display:flex;justify-content:space-between;gap:12px;font-size:14px;line-height:22px"><span style="color:#476273">الجامعة</span><span style="font-weight:500">المنصورة الجديدة</span></div>
</div>
</sc-if>

<button type="button" aria-expanded="{{coExp}}" onClick="{{toggleCo}}" style="width:100%;display:flex;align-items:center;justify-content:space-between;min-height:56px;border-top:1px solid #DCE6EC;font-size:16px;line-height:24px;font-weight:600">
<span>الشركة</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#58707F" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform:rotate({{coRot}})"><path d="m6 9 6 6 6-6"></path></svg>
</button>
<sc-if value="{{coOpen}}" hint-placeholder-val="{{false}}">
<div style="display:flex;flex-direction:column;gap:12px;padding-bottom:16px">
<div style="display:flex;justify-content:space-between;gap:12px;font-size:14px;line-height:22px"><span style="color:#476273">الاسم</span><span style="font-weight:500">النورس للنقل</span></div>
<div style="display:flex;justify-content:space-between;gap:12px;font-size:14px;line-height:22px"><span style="color:#476273">الهاتف</span><span dir="ltr" style="font-weight:500">057 240 1122</span></div>
<div style="display:flex;justify-content:space-between;gap:12px;font-size:14px;line-height:22px"><span style="color:#476273">العنوان</span><span style="font-weight:500">الزرقا، دمياط</span></div>
</div>
</sc-if>

</div>
</div>

<div style="margin:auto -20px 0;background:#FFFFFF;border-radius:28px 28px 0 0;padding:16px 20px 34px;display:flex;gap:10px;box-shadow:0 -8px 32px -16px rgba(23,56,74,.18)">
<button type="button" style="flex:1;height:54px;border-radius:16px;background:#00658D;color:#FFFFFF;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:600">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"></path></svg>
<span>تنزيل PDF</span>
</button>
<button type="button" aria-label="حفظ كصورة" style="width:54px;height:54px;border-radius:16px;background:#E4ECF1;display:flex;align-items:center;justify-content:center;flex:none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-4.5-4.5L6 21"></path></svg>
</button>
<button type="button" aria-label="مشاركة" style="width:54px;height:54px;border-radius:16px;background:#E4ECF1;display:flex;align-items:center;justify-content:center;flex:none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M8 7l4-4 4 4M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"></path></svg>
</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const open = s.open === undefined ? 'sub' : s.open;
const toggle = (id) => () => this.setState({ open: open === id ? '' : id });
const rot = (id) => (open === id ? '180deg' : '0deg');
const exp = (id) => (open === id ? 'true' : 'false');
return {
subOpen: open === 'sub', stuOpen: open === 'stu', coOpen: open === 'co',
subRot: rot('sub'), stuRot: rot('stu'), coRot: rot('co'),
subExp: exp('sub'), stuExp: exp('stu'), coExp: exp('co'),
toggleSub: toggle('sub'), toggleStu: toggle('stu'), toggleCo: toggle('co')
};
}
}
</script>
</body>
</html>
