<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>اشتراك جديد · محطة الصعود</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit}
a{color:#00658D;text-decoration:none}a:hover{color:#004F6E}
</style>
</helmet>
<div dir="rtl" style="width:390px;height:844px;background:#F0F5F8;font-family:'Readex Pro','Segoe UI',Tahoma,sans-serif;color:#17384A;position:relative;overflow:hidden">

<div aria-hidden="true" style="padding:64px 20px 0;display:flex;flex-direction:column;gap:4px">
<div style="font-size:28px;line-height:38px;font-weight:600">اشتراك جديد</div>
</div>
<div aria-hidden="true" style="position:absolute;inset:0;background:rgba(23,56,74,.48)"></div>

<section role="dialog" aria-label="محطة الصعود" style="position:absolute;left:0;right:0;bottom:0;background:#FFFFFF;border-radius:28px 28px 0 0;padding:10px 20px 34px;display:flex;flex-direction:column;gap:14px">
<span aria-hidden="true" style="width:40px;height:4px;border-radius:2px;background:#C3D1DA;align-self:center"></span>

<div style="display:flex;flex-direction:column;gap:2px;padding-top:4px">
<h1 style="margin:0;font-size:22px;line-height:32px;font-weight:600">من أين تركب؟</h1>
<p style="margin:0;font-size:14px;line-height:22px;color:#476273">خط الزرقا · 7 محطات · 5 رحلات صباحاً</p>
</div>

<div style="display:flex;align-items:center;gap:10px;height:50px;border-radius:16px;background:#E4ECF1;padding:0 14px;color:#58707F">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input type="search" aria-label="ابحث عن محطة" placeholder="ابحث عن محطة" style="flex:1;min-width:0;height:50px;border:0;background:transparent;font-size:15px;color:#17384A;outline:none">
</div>

<div role="radiogroup" aria-label="المحطات بترتيب المسار" style="display:flex;flex-direction:column;margin:0 -8px">
<sc-for list="{{stops}}" as="s" hint-placeholder-count="7">
<button type="button" role="radio" aria-checked="{{s.on}}" onClick="{{s.pick}}" style="display:flex;align-items:stretch;gap:12px;min-height:52px;border-radius:14px;padding:0 12px;text-align:right;background:{{s.bg}}">
<span aria-hidden="true" style="width:14px;display:flex;flex-direction:column;align-items:center;flex:none">
<span style="width:2px;height:19px;flex:none;background:{{s.top}}"></span>
<span style="width:14px;height:14px;border-radius:7px;flex:none;background:{{s.dot}};box-shadow:inset 0 0 0 2px {{s.dotRing}}"></span>
<span style="width:2px;flex:1;background:{{s.bottom}}"></span>
</span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column;padding:13px 0">
<span style="display:flex;align-items:baseline;justify-content:space-between;gap:12px">
<span style="font-size:16px;line-height:26px;font-weight:{{s.w}}">{{s.name}}</span>
<sc-if value="{{s.closed}}" hint-placeholder-val="{{true}}">
<span style="font-size:13px;line-height:20px;color:#58707F;flex:none">{{s.first}}</span>
</sc-if>
</span>
<sc-if value="{{s.open}}" hint-placeholder-val="{{false}}">
<span style="font-size:12px;line-height:18px;color:#476273;padding-top:6px">يمرّ الباص صباحاً</span>
<span style="font-size:14px;line-height:22px;font-weight:500;color:#00658D">{{s.all}}</span>
</sc-if>
</span>
</button>
</sc-for>
</div>

<a href="FlowPeriod.dc.html" style="height:54px;border-radius:16px;background:#00658D;color:#FFFFFF;display:flex;align-items:center;justify-content:center;gap:6px;font-size:16px;font-weight:600">
<span>اختيار</span>
<span>{{pickedName}}</span>
</a>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const picked = (this.state && this.state.picked) || 's4';
const list = [
{ id: 's1', name: 'موقف الزرقا', times: ['6:15', '7:00', '7:45', '8:30', '9:15'] },
{ id: 's2', name: 'ميت الخولي', times: ['6:22', '7:07', '7:52', '8:37', '9:22'] },
{ id: 's3', name: 'شرباص', times: ['6:30', '7:15', '8:00', '8:45', '9:30'] },
{ id: 's4', name: 'كوبري السرو', times: ['6:38', '7:23', '8:08', '8:53', '9:38'] },
{ id: 's5', name: 'السرو', times: ['6:45', '7:30', '8:15', '9:00', '9:45'] },
{ id: 's6', name: 'الروضة', times: ['6:55', '7:40', '8:25', '9:10', '9:55'] },
{ id: 's7', name: 'فارسكور', times: ['7:05', '7:50', '8:35', '9:20', '10:05'] }
];
const rail = '#C3D1DA';
return {
pickedName: (list.find((s) => s.id === picked) || list[0]).name,
stops: list.map((s, i) => {
const on = s.id === picked;
return {
id: s.id,
name: s.name,
first: 'من ' + s.times[0] + ' ص',
all: s.times.join(' · ') + ' ص',
open: on,
closed: !on,
on: on ? 'true' : 'false',
bg: on ? '#E5F3FA' : 'transparent',
w: on ? 600 : 400,
top: i === 0 ? 'transparent' : rail,
bottom: i === list.length - 1 ? 'transparent' : rail,
dot: on ? '#00658D' : '#FFFFFF',
dotRing: on ? '#00658D' : '#9DB0BB',
pick: () => this.setState({ picked: s.id })
};
})
};
}
}
</script>
</body>
</html>
