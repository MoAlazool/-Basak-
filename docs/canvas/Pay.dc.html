<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الدفع ورفع الإيصال</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:#00658D;text-decoration:none}a:hover{color:#004F6E}
</style>
</helmet>
<div dir="rtl" style="width:390px;height:1040px;background:#F0F5F8;font-family:'Readex Pro','Segoe UI',Tahoma,sans-serif;color:#17384A;display:flex;flex-direction:column;padding:60px 20px 0;overflow:hidden">

<a href="SubscriptionAwaiting.dc.html" aria-label="رجوع" style="width:44px;height:44px;border-radius:22px;background:#FFFFFF;color:#17384A;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(23,56,74,.05)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"></path></svg>
</a>

<div style="display:flex;flex-direction:column;gap:2px;padding:20px 0 24px">
<div style="font-size:13px;line-height:20px;color:#58707F">المبلغ المطلوب · الفصل الأول</div>
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
<h1 style="margin:0;font-size:34px;line-height:44px;font-weight:600">4,500 <span style="font-size:16px;font-weight:400;color:#58707F">ج.م</span></h1>
<button type="button" style="height:44px;padding:0 14px;border-radius:14px;background:#FFFFFF;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;box-shadow:0 1px 2px rgba(23,56,74,.05);flex:none">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"></path></svg>
<span>نسخ المبلغ</span>
</button>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:24px">

<section style="display:flex;flex-direction:column;gap:12px">
<h2 style="margin:0;font-size:17px;line-height:26px;font-weight:600">1 · حوّل المبلغ</h2>
<div role="radiogroup" aria-label="طريقة الدفع" style="display:flex;flex-wrap:wrap;gap:8px">
<sc-for list="{{methods}}" as="m" hint-placeholder-count="5">
<button type="button" role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}" style="height:44px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap;background:{{m.bg}};color:{{m.fg}}">{{m.label}}</button>
</sc-for>
</div>

<div style="background:#FFFFFF;border-radius:20px;padding:0 16px;box-shadow:0 1px 2px rgba(23,56,74,.05)">
<div style="display:flex;align-items:center;gap:12px;min-height:64px">
<span aria-hidden="true" style="width:40px;height:40px;border-radius:12px;background:#D6EBF5;color:#00658D;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;flex:none">ن</span>
<div style="min-width:0">
<div style="font-size:15px;line-height:22px;font-weight:600">شركة النورس للنقل</div>
<div style="font-size:12px;line-height:18px;color:#58707F">{{holderSub}}</div>
</div>
</div>
<sc-for list="{{fields}}" as="f" hint-placeholder-count="1">
<div style="display:flex;align-items:center;gap:12px;min-height:64px;border-top:1px solid #DCE6EC">
<div style="flex:1;min-width:0">
<div style="font-size:12px;line-height:18px;color:#58707F">{{f.label}}</div>
<div dir="ltr" style="font-size:16px;line-height:24px;font-weight:600;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{f.value}}</div>
</div>
<button type="button" aria-label="{{f.copyLabel}}" style="height:44px;padding:0 14px;border-radius:14px;background:#E4ECF1;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;flex:none">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"></path></svg>
<span>نسخ</span>
</button>
</div>
</sc-for>
</div>

<div style="background:#FFFFFF;border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(23,56,74,.05)">
<div style="display:flex;align-items:center;justify-content:space-between">
<div style="display:flex;align-items:center;gap:8px;font-size:14px;line-height:22px;font-weight:600">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#476273" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
<span>قبل التحويل</span>
</div>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#58707F" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg>
</div>
<ol style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:22px;color:#476273">
<li style="display:flex;gap:10px"><span style="color:#17384A;font-weight:600;flex:none">1</span><span>حوّل المبلغ كاملاً في عملية واحدة.</span></li>
<li style="display:flex;gap:10px"><span style="color:#17384A;font-weight:600;flex:none">2</span><span>اكتب اسمك الثلاثي في ملاحظات التحويل.</span></li>
</ol>
</div>
</section>

<section style="display:flex;flex-direction:column;gap:12px">
<h2 style="margin:0;font-size:17px;line-height:26px;font-weight:600">2 · ارفع الإيصال</h2>
<div style="border-radius:20px;border:1.5px dashed #9DB0BB;padding:20px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:14px">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px;color:#476273">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg>
<div style="font-size:14px;line-height:22px">صورة واضحة فيها رقم العملية والتاريخ</div>
</div>
<div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px;width:100%">
<a href="PayUpload.dc.html" style="height:48px;border-radius:14px;background:#FFFFFF;color:#17384A;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:600;box-shadow:0 1px 2px rgba(23,56,74,.05)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
<span>الكاميرا</span>
</a>
<a href="PayUpload.dc.html" style="height:48px;border-radius:14px;background:#FFFFFF;color:#17384A;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:600;box-shadow:0 1px 2px rgba(23,56,74,.05)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-4.5-4.5L6 21"></path></svg>
<span>من الصور</span>
</a>
</div>
</div>
</section>

</div>

<div style="margin:auto -20px 0;background:#FFFFFF;border-radius:28px 28px 0 0;padding:16px 20px 34px;box-shadow:0 -8px 32px -16px rgba(23,56,74,.18)">
<button type="button" disabled style="width:100%;height:54px;border-radius:16px;background:#E4ECF1;color:#9DB0BB;font-size:16px;font-weight:600;cursor:default">إرسال للمراجعة</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
renderVals() {
const picked = (this.state && this.state.method) || 'instapay';
const list = [
{ id: 'instapay', label: 'InstaPay', sub: 'InstaPay', fields: [
{ label: 'عنوان InstaPay', value: 'elnawras@instapay', copyLabel: 'نسخ عنوان InstaPay' }
] },
{ id: 'wallet', label: 'فودافون كاش', sub: 'محفظة فودافون كاش', fields: [
{ label: 'رقم المحفظة', value: '010 1234 5678', copyLabel: 'نسخ رقم المحفظة' }
] },
{ id: 'wallet2', label: 'اتصالات كاش', sub: 'محفظة اتصالات كاش', fields: [
{ label: 'رقم المحفظة', value: '011 1234 5678', copyLabel: 'نسخ رقم المحفظة' }
] },
{ id: 'bank', label: 'البنك الأهلي', sub: 'تحويل بنكي · البنك الأهلي المصري', fields: [
{ label: 'رقم الحساب', value: '0123 4567 8901 234', copyLabel: 'نسخ رقم الحساب' },
{ label: 'IBAN', value: 'EG00 0003 0000 0000 0000 0000 000', copyLabel: 'نسخ IBAN' }
] },
{ id: 'bank2', label: 'بنك مصر', sub: 'تحويل بنكي · بنك مصر', fields: [
{ label: 'رقم الحساب', value: '0987 6543 2109 876', copyLabel: 'نسخ رقم الحساب' },
{ label: 'IBAN', value: 'EG00 0002 0000 0000 0000 0000 000', copyLabel: 'نسخ IBAN' }
] }
];
const current = list.find((m) => m.id === picked) || list[0];
return {
holderSub: current.sub,
fields: current.fields,
methods: list.map((m) => {
const on = m.id === picked;
return {
id: m.id,
label: m.label,
on: on ? 'true' : 'false',
bg: on ? '#00658D' : '#FFFFFF',
fg: on ? '#FFFFFF' : '#17384A',
pick: () => this.setState({ method: m.id })
};
})
};
}
}
</script>
</body>
</html>
