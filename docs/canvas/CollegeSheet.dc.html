<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>اختيار الكلية</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit}
a{color:#00658D;text-decoration:none}a:hover{color:#004F6E}
</style>
</helmet>
<div dir="rtl" style="width:390px;height:844px;background:#F0F5F8;font-family:'Readex Pro','Segoe UI',Tahoma,sans-serif;color:#17384A;position:relative;overflow:hidden">

<div aria-hidden="true" style="position:absolute;inset:0;display:flex;flex-direction:column;padding:60px 20px 34px;gap:18px;overflow:hidden"><div style="display:flex;align-items:center;justify-content:space-between;min-height:44px"><a href="SignUp.dc.html" aria-label="رجوع" style="position:relative;width:44px;height:44px;border-radius:22px;background:#FFFFFF;color:#17384A;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(23,56,74,.05);flex:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"></path></svg></a><span style="font-size:15px;line-height:24px;font-weight:600">إنشاء حساب</span></div><div role="img" aria-label="الخطوة 2 من 4: دراستك" style="display:flex;margin:0 -14px"><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="align-self:stretch;display:flex;align-items:center"><span style="flex:1;height:2px;background:transparent"></span><span style="width:20px;height:20px;border-radius:10px;background:#00658D;color:#FFFFFF;display:flex;align-items:center;justify-content:center;flex:none"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span style="flex:1;height:2px;background:#00658D"></span></div><span style="font-size:12px;line-height:18px;font-weight:400;color:#00658D">بياناتك</span></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="align-self:stretch;display:flex;align-items:center"><span style="flex:1;height:2px;background:#00658D"></span><span style="width:20px;height:20px;border-radius:10px;background:#FFFFFF;box-shadow:inset 0 0 0 2px #00658D;display:flex;align-items:center;justify-content:center;flex:none"><span style="width:8px;height:8px;border-radius:4px;background:#00658D"></span></span><span style="flex:1;height:2px;background:#D5E0E7"></span></div><span style="font-size:12px;line-height:18px;font-weight:600;color:#17384A">دراستك</span></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="align-self:stretch;display:flex;align-items:center"><span style="flex:1;height:2px;background:#D5E0E7"></span><span style="width:20px;height:20px;border-radius:10px;background:#FFFFFF;box-shadow:inset 0 0 0 2px #C3D1DA;flex:none"></span><span style="flex:1;height:2px;background:#D5E0E7"></span></div><span style="font-size:12px;line-height:18px;font-weight:400;color:#58707F">صورتك</span></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="align-self:stretch;display:flex;align-items:center"><span style="flex:1;height:2px;background:#D5E0E7"></span><span style="width:20px;height:20px;border-radius:10px;background:#FFFFFF;box-shadow:inset 0 0 0 2px #C3D1DA;flex:none"></span><span style="flex:1;height:2px;background:transparent"></span></div><span style="font-size:12px;line-height:18px;font-weight:400;color:#58707F">كلمة المرور</span></div></div><div style="padding-top:6px"><h1 style="margin:0;font-size:26px;line-height:36px;font-weight:600">أين تدرس؟</h1><p style="margin:6px 0 0;font-size:15px;line-height:24px;color:#476273;text-wrap:pretty">جامعتك تحدّد الخطوط والشركات التي تظهر لك.</p></div><div style="background:#FFFFFF;border-radius:20px;padding:0 16px;box-shadow:0 1px 2px rgba(23,56,74,.05)"><a href="UniversitySheet.dc.html" style="color:#17384A;display:block"><div style="display:flex;align-items:center;gap:10px;min-height:66px;border-bottom:1px solid #DCE6EC;"><div style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="font-size:12px;line-height:18px;font-weight:500;color:#58707F">الجامعة</span><span style="font-size:16px;line-height:24px;">جامعة المنصورة الجديدة</span></div><span style="color:#58707F;display:flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span></div></a><a href="CollegeSheet.dc.html" style="color:#17384A;display:block"><div style="display:flex;align-items:center;gap:10px;min-height:66px;"><div style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="font-size:12px;line-height:18px;font-weight:500;color:#58707F">الكلية</span><span style="font-size:16px;line-height:24px;">الهندسة</span></div><span style="color:#58707F;display:flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span></div></a></div><div style="display:flex;gap:10px;align-items:flex-start"><span style="color:#58707F;display:flex;padding-top:2px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-4M12 8h.01"></path></svg></span><p style="margin:0;font-size:13px;line-height:20px;color:#58707F;text-wrap:pretty">لا يمكن تغيير الجامعة بعد التسجيل.</p></div><div style="margin-top:auto;display:flex;flex-direction:column;gap:2px"><a href="SignUpPhoto.dc.html" style="height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;padding:0 18px;background:#00658D;color:#FFFFFF;font-weight:600;"><span>التالي</span></a></div></div>
<div aria-hidden="true" style="position:absolute;inset:0;background:rgba(23,56,74,.48)"></div>

<section role="dialog" aria-label="اختيار الكلية" style="position:absolute;left:0;right:0;bottom:0;background:#FFFFFF;border-radius:28px 28px 0 0;padding:10px 20px 34px;display:flex;flex-direction:column;gap:14px">
<span aria-hidden="true" style="width:40px;height:4px;border-radius:2px;background:#C3D1DA;align-self:center"></span>

<h1 style="margin:0;padding-top:4px;font-size:22px;line-height:32px;font-weight:600">كليتك</h1>

<div style="display:flex;align-items:center;gap:10px;height:50px;border-radius:16px;background:#E4ECF1;padding:0 14px;color:#58707F">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input type="search" aria-label="ابحث عن كليتك" placeholder="ابحث باسم الكلية" style="flex:1;min-width:0;height:50px;border:0;background:transparent;font-size:15px;color:#17384A;outline:none">
</div>

<div role="radiogroup" aria-label="الكليات" style="display:flex;flex-direction:column;gap:2px;margin:0 -8px">
<sc-for list="{{colleges}}" as="c" hint-placeholder-count="7">
<button type="button" role="radio" aria-checked="{{c.on}}" onClick="{{c.pick}}" style="display:flex;align-items:center;gap:12px;min-height:50px;border-radius:14px;padding:0 12px;text-align:right;background:{{c.bg}}">
<span style="flex:1;min-width:0;font-size:16px;line-height:26px;font-weight:{{c.w}}">{{c.name}}</span>
<span aria-hidden="true" style="width:22px;height:22px;border-radius:11px;flex:none;box-shadow:inset 0 0 0 {{c.ringW}} {{c.ringC}}"></span>
</button>
</sc-for>
</div>

<button type="button" style="align-self:flex-start;min-height:44px;padding:0 4px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:#00658D">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
<span>كلية أخرى</span>
</button>

<a href="SignUpStudy.dc.html" style="height:54px;border-radius:16px;background:#00658D;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600">تأكيد</a>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const picked = (this.state && this.state.picked) || 'eng';
const list = [
{ id: 'eng', name: 'الهندسة' },
{ id: 'med', name: 'الطب' },
{ id: 'pharm', name: 'الصيدلة' },
{ id: 'dent', name: 'طب الأسنان' },
{ id: 'cs', name: 'الحاسبات والمعلومات' },
{ id: 'sci', name: 'العلوم' },
{ id: 'com', name: 'التجارة' }
];
return {
colleges: list.map((c) => {
const on = c.id === picked;
return {
...c,
on: on ? 'true' : 'false',
bg: on ? '#E5F3FA' : 'transparent',
w: on ? 600 : 400,
ringW: on ? '7px' : '2px',
ringC: on ? '#00658D' : '#C3D1DA',
pick: () => this.setState({ picked: c.id })
};
})
};
}
}
</script>
</body>
</html>
