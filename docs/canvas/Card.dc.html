<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
// Placeholder pattern that only looks like a QR code; the app renders the real one with qr_flutter.
const n = 25;
let seed = 20261009;
const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
const inFinder = (x, y) => (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
const finder = (x, y) => 'M' + x + ' ' + y + 'h7v7h-7zM' + (x + 1) + ' ' + (y + 1) + 'v5h5v-5zM' + (x + 2) + ' ' + (y + 2) + 'h3v3h-3z';
let d = finder(0, 0) + finder(n - 7, 0) + finder(0, n - 7);
for (let y = 0; y < n; y++) {
for (let x = 0; x < n; x++) {
if (!inFinder(x, y) && rnd() < 0.47) d += 'M' + x + ' ' + y + 'h1v1h-1z';
}
}
return { qr: d };
}
}
</script>
