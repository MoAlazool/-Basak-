<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>التنبيهات</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:#00658D;text-decoration:none}a:hover{color:#004F6E}
</style>
</helmet>
<div dir="rtl" style="width:390px;height:844px;background:#F0F5F8;font-family:'Readex Pro','Segoe UI',Tahoma,sans-serif;color:#17384A;display:flex;flex-direction:column;padding:60px 20px 34px;gap:16px;overflow:hidden">

<div style="display:flex;align-items:center;gap:12px">
<a href="Main.dc.html" aria-label="رجوع" style="width:44px;height:44px;border-radius:22px;background:#FFFFFF;color:#17384A;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(23,56,74,.05);flex:none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"></path></svg>
</a>
<h1 style="flex:1;margin:0;font-size:20px;line-height:30px;font-weight:600">التنبيهات</h1>
<button type="button" style="min-height:44px;padding:0 4px;color:#00658D;font-size:14px;font-weight:600">قراءة الكل</button>
</div>

<div role="tablist" aria-label="تصفية التنبيهات" style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:4px;background:#E4ECF1;border-radius:14px;padding:4px">
<button type="button" role="tab" aria-selected="{{allSel}}" onClick="{{showAll}}" style="height:40px;border-radius:10px;font-size:14px;font-weight:{{allW}};background:{{allBg}};color:{{allFg}}">الكل</button>
<button type="button" role="tab" aria-selected="{{unSel}}" onClick="{{showUnread}}" style="height:40px;border-radius:10px;font-size:14px;font-weight:{{unW}};background:{{unBg}};color:{{unFg}}">غير المقروءة · 2</button>
</div>

<section style="display:flex;flex-direction:column;gap:8px;padding-top:4px">
<h2 style="margin:0;padding:0 4px;font-size:13px;line-height:20px;font-weight:500;color:#476273">اليوم</h2>
<div style="background:#FFFFFF;border-radius:20px;padding:0 16px;box-shadow:0 1px 2px rgba(23,56,74,.05)">
<sc-for list="{{today}}" as="n" hint-placeholder-count="2">
<a href="{{n.href}}" style="display:flex;align-items:flex-start;gap:12px;padding:14px 0;color:#17384A;border-top:1px solid {{n.rule}}">
<span aria-hidden="true" style="width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;background:{{n.tint}};color:{{n.tone}}">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.d}}"></path></svg>
</span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column">
<span style="font-size:15px;line-height:24px;font-weight:{{n.w}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{n.title}}</span>
<span style="font-size:13px;line-height:20px;color:#476273;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{n.body}}</span>
</span>
<span style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none;padding-top:3px">
<span style="font-size:12px;line-height:18px;color:#58707F">{{n.time}}</span>
<span aria-hidden="true" style="width:8px;height:8px;border-radius:4px;background:{{n.dot}}"></span>
</span>
</a>
</sc-for>
</div>
</section>

<sc-if value="{{hasOlder}}" hint-placeholder-val="{{true}}">
<section style="display:flex;flex-direction:column;gap:8px;padding-top:4px">
<h2 style="margin:0;padding:0 4px;font-size:13px;line-height:20px;font-weight:500;color:#476273">أمس</h2>
<div style="background:#FFFFFF;border-radius:20px;padding:0 16px;box-shadow:0 1px 2px rgba(23,56,74,.05)">
<a href="HomeRide.dc.html" style="display:flex;align-items:flex-start;gap:12px;padding:14px 0;color:#17384A">
<span aria-hidden="true" style="width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;background:#E4ECF1;color:#476273">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
</span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column">
<span style="font-size:15px;line-height:24px;font-weight:400">لم تؤكد رحلة الغد بعد</span>
<span style="font-size:13px;line-height:20px;color:#476273">التأكيد متاح حتى 6:00 ص.</span>
</span>
<span style="font-size:12px;line-height:18px;color:#58707F;flex:none;padding-top:3px">9:00 م</span>
</a>
</div>
</section>

<section style="display:flex;flex-direction:column;gap:8px;padding-top:4px">
<h2 style="margin:0;padding:0 4px;font-size:13px;line-height:20px;font-weight:500;color:#476273">22 سبتمبر</h2>
<div style="background:#FFFFFF;border-radius:20px;padding:0 16px;box-shadow:0 1px 2px rgba(23,56,74,.05)">
<a href="Main.dc.html" style="display:flex;align-items:flex-start;gap:12px;padding:14px 0;color:#17384A">
<span aria-hidden="true" style="width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;background:#E3F4EC;color:#0A6B4A">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
</span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column">
<span style="font-size:15px;line-height:24px;font-weight:400">تم تفعيل اشتراكك</span>
<span style="font-size:13px;line-height:20px;color:#476273">الفصل الأول · صالح حتى 14 يناير 2027</span>
</span>
<span style="font-size:12px;line-height:18px;color:#58707F;flex:none;padding-top:3px">4:12 م</span>
</a>
<a href="SubscriptionReview.dc.html" style="display:flex;align-items:flex-start;gap:12px;padding:14px 0;color:#17384A;border-top:1px solid #DCE6EC">
<span aria-hidden="true" style="width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;background:#E4ECF1;color:#476273">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg>
</span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column">
<span style="font-size:15px;line-height:24px;font-weight:400">استلمنا إيصالك</span>
<span style="font-size:13px;line-height:20px;color:#476273">قيد مراجعة شركة النورس للنقل.</span>
</span>
<span style="font-size:12px;line-height:18px;color:#58707F;flex:none;padding-top:3px">10:05 ص</span>
</a>
</div>
</section>
<button type="button" style="align-self:center;min-height:44px;padding:0 12px;font-size:14px;font-weight:600;color:#00658D">عرض تنبيهات أقدم</button>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const unreadOnly = !!(this.state && this.state.unreadOnly);
const bus = 'M7 3h10a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3ZM4 11h16M8 18v3M16 18v3M8 15h.01M16 15h.01';
const speak = 'M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1ZM15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12';
const today = [
{ title: 'الباص تحرّك من موقف الزرقا', body: 'رحلة 7:00 ص · خط الزرقا', time: '6:58 ص', d: bus, tint: '#E3F4EC', tone: '#0A6B4A', href: 'Main.dc.html' },
{ title: 'رسالة من مشرف الباص', body: 'غداً الركوب من أمام البنك بدل الموقف.', time: '6:20 ص', d: speak, tint: '#E5F3FA', tone: '#00658D', href: 'InboxDetail.dc.html' }
];
const sel = (on) => ({ s: on ? 'true' : 'false', w: on ? 600 : 500, bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#17384A' : '#476273' });
const a = sel(!unreadOnly);
const u = sel(unreadOnly);
return {
today: today.map((item, i) => ({ ...item, w: 600, dot: '#00658D', rule: i === 0 ? 'transparent' : '#DCE6EC' })),
hasOlder: !unreadOnly,
allSel: a.s, allW: a.w, allBg: a.bg, allFg: a.fg,
unSel: u.s, unW: u.w, unBg: u.bg, unFg: u.fg,
showAll: () => this.setState({ unreadOnly: false }),
showUnread: () => this.setState({ unreadOnly: true })
};
}
}
</script>
</body>
</html>
